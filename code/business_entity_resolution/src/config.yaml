blocking:
  top_k: 50          # Increased from 20 → captures far more true matches per pass
  min_sim: 0.05       # Lowered from 0.15 → let the XGBoost model do the pruning
  n_components: 256   # Increased from 128 → less information loss in LSA compression
  use_semantic: false

model:
  xgb_n_estimators: 400
  xgb_max_depth: 6
  xgb_learning_rate: 0.05
  lr_max_iter: 1000

pipeline:
  train_sample_size: null   # Train on ALL candidates (was capped at 50000 — now removed)
  streaming_chunk_size: 500000
